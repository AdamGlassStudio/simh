; ediv_reg.ini — EDIV R0, R2, R4, R5
; Opcode 7B, spec R0=0x50, R2=0x52, R4=0x54, R5=0x55
; Divisor R0 = 7
; Dividend R2:R3 = 0x00000000:0x00000064 (100 as quadword)
; Quotient R4 = 100/7 = 14, Remainder R5 = 100%7 = 2
deposit r0 7
deposit r2 64
deposit r3 0
deposit r4 0
deposit r5 0
deposit psl 041F0000
deposit pc 0
deposit -b 0 7b
deposit -b 1 50
deposit -b 2 52
deposit -b 3 54
deposit -b 4 55
step
examine r0
examine r4
examine r5
examine psl
