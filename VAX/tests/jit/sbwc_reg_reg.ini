; sbwc_reg_reg.ini — SBWC R1, R2 (subtract with carry)
; Opcode D9, spec R1=0x51, spec R2=0x52
; C = 1, R1 = 5, R2 = 20
; Result: R2 = 20 - 5 - 1 = 14 (0x0E)
; CC: N=0, Z=0, V=0, C=0
deposit r1 5
deposit r2 14
deposit psl 041F0001
deposit pc 0
deposit -b 0 d9
deposit -b 1 51
deposit -b 2 52
step
examine r1
examine r2
examine psl
