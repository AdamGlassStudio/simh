; popr_lit.ini — POPR #0x07 (pop R0, R1, R2 from stack)
; Opcode BA, spec #7 = 0x07 (short literal)
; Stack at SP=0x1000: [0xAA, 0xBB, 0xCC] (3 longwords)
; R0=0xAA, R1=0xBB, R2=0xCC, SP=0x100C after
deposit r0 0
deposit r1 0
deposit r2 0
deposit r14 1000
deposit 1000 000000AA
deposit 1004 000000BB
deposit 1008 000000CC
deposit psl 041F0000
deposit pc 0
deposit -b 0 ba
deposit -b 1 07
step
examine r0
examine r1
examine r2
examine r14
