; Multi-instruction block: MOVL #1,R0 then ADDL2 #2,R0 → R0=3
; Uses a breakpoint at address 14 (after both instructions) so that
; both JIT and interpreter modes stop at the same PC with R0=3.
;
; MOVL #1,R0   : D0 8F 01 00 00 00 50  (7 bytes, addr 0-6)
; ADDL2 #2,R0  : C0 8F 02 00 00 00 50  (7 bytes, addr 7-13)
; Breakpoint    : addr 14 = 0xe
deposit r0 0
deposit r1 0
deposit pc 0
deposit -b 0 d0
deposit -b 1 8f
deposit -b 2 01
deposit -b 3 00
deposit -b 4 00
deposit -b 5 00
deposit -b 6 50
deposit -b 7 c0
deposit -b 8 8f
deposit -b 9 02
deposit -b a 00
deposit -b b 00
deposit -b c 00
deposit -b d 50
set break 0xe
go
examine r0
examine r1
examine r2
examine r3
examine r4
examine r5
examine r6
examine r7
examine r8
examine r9
examine r10
examine r11
examine r12
examine r13
examine r14
examine psl
