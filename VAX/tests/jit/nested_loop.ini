; nested_loop.ini — nested counted loops via BGTR back-edges
;
; Outer loop (R2): counts 5 → 0  (5 iterations)
; Inner loop (R3): counts 3 → 0  (3 iterations per outer)
; R0: incremented on every inner iteration → expected R0 = 5×3 = 15 = 0xF
;
; Layout (all at PC=0):
;   0x00: D4 50       CLRL  R0            ; clear accumulator
;   0x02: D0 05 52    MOVL  #5, R2        ; outer count = 5
;   0x05: D0 03 53    MOVL  #3, R3        ; inner count = 3  ← outer_top
;   0x08: D6 50       INCL  R0            ;                  ← inner_top
;   0x0A: D7 53       DECL  R3
;   0x0C: 14 FA       BGTR  inner_top     ; target=0x08, disp=8-14=-6=0xFA
;   0x0E: D7 52       DECL  R2
;   0x10: 14 F3       BGTR  outer_top     ; target=0x05, disp=5-18=-13=0xF3
;   0x12:             ← breakpoint
;
; Region JIT should capture all 8 instructions as one block with two
; conditional back-edges (inner_top and outer_top).

deposit r0 0
deposit r1 0
deposit r2 0
deposit r3 0
deposit pc 0
deposit -b 0 d4
deposit -b 1 50
deposit -b 2 d0
deposit -b 3 05
deposit -b 4 52
deposit -b 5 d0
deposit -b 6 03
deposit -b 7 53
deposit -b 8 d6
deposit -b 9 50
deposit -b a d7
deposit -b b 53
deposit -b c 14
deposit -b d fa
deposit -b e d7
deposit -b f 52
deposit -b 10 14
deposit -b 11 f3
set break 12
go
examine r0
examine r1
examine r2
examine r3
examine r4
examine r5
examine r6
examine r7
examine r8
examine r9
examine r10
examine r11
examine r12
examine r13
examine r14
examine psl
