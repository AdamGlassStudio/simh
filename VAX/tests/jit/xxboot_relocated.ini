; xxboot JIT test: load xxboot binary, run from start_uvax (VAX_BOOT_ENTRY=0x200)
; to 'relocated' (0x10024a) — after MOVC5/REI, before Xmain touches disk.
;
; Path:
;   0x100200 start_uvax  - MOVZBL, BRB  (JIT + interpreter)
;   0x100209 start_all   - MOVL, PUSHR, SUBL3×2, MOVAL, MOVL, MOVC5, MOVPSL, MOVL, REI
;   0x10024a relocated   - breakpoint here
;
; Load raw binary at 0x100000 (-o = origin in hex)
load -o /tmp/xxboot_gcc.bin 100000
deposit pc 100200
set break 10024a
go
examine r0
examine r1
examine r2
examine r3
examine r4
examine r5
examine r6
examine r7
examine r8
examine r9
examine r10
examine r11
examine r12
examine r13
examine r14
examine psl
