; MOVZBL R0, R1 — zero-extend low byte of R0 into R1
; R0 = 0x12345678 (low byte = 0x78)
; R1 = 0xDEADBEEF → becomes 0x00000078
; Encoding: 9A 50 51
deposit r0 12345678
deposit r1 DEADBEEF
deposit pc 0
deposit -b 0 9A
deposit -b 1 50
deposit -b 2 51
step
examine r0
examine r1
examine r2
examine r3
examine r4
examine r5
examine r6
examine r7
examine r8
examine r9
examine r10
examine r11
examine r12
examine r13
examine r14
examine psl
