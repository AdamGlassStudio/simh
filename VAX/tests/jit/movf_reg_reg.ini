; movf_reg_reg.ini — MOVF R0, R1 (move F-float = move longword, float CC)
; Opcode 50, spec R0=0x50, spec R1=0x51
; R0 = 0x00004080 (F-float 1.0 in VAX format: exp=0x81, sign=0)
; Result: R1 = 0x00004080, CC: N=0 Z=0 V=0 C=unchanged
deposit r0 00004080
deposit r1 0
deposit psl 041F0000
deposit pc 0
deposit -b 0 50
deposit -b 1 50
deposit -b 2 51
step
examine r0
examine r1
examine psl
