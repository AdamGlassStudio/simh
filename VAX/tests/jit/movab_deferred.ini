; movab_deferred.ini — MOVAB (R2), R3
; EA of (R2) = value of R2 = 0x12345678
; Result: R3 = 0x12345678; N=0, Z=0, V=0, C=0
; Encoding: 9E 62 53
;   9E=MOVAB, 62=reg-deferred R2 (mode6, reg2), 53=reg R3
deposit r2 12345678
deposit pc 0
deposit -b 0 9e
deposit -b 1 62
deposit -b 2 53
step
examine r0
examine r1
examine r2
examine r3
examine r4
examine r5
examine r6
examine r7
examine r8
examine r9
examine r10
examine r11
examine r12
examine r13
examine r14
examine psl
