; adwc_reg_reg.ini — ADWC R1, R2 (add with carry)
; Opcode D8, spec R1=0x51, spec R2=0x52
; First set C=1 by setting PSL bit 0
; R1 = 10, R2 = 20, C = 1
; Result: R2 = 10 + 20 + 1 = 31 (0x1F)
; CC: N=0, Z=0, V=0, C=0
deposit r1 a
deposit r2 14
deposit psl 041F0001
deposit pc 0
deposit -b 0 d8
deposit -b 1 51
deposit -b 2 52
step
examine r1
examine r2
examine psl
