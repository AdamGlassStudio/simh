; movc3_mem.ini — MOVC3 #4, (R2), (R3) (copy 4 bytes)
; Opcode 28: len=#4(lit 0x04), srcaddr=R2, dstaddr=R3
; Source at 0x200: DE AD BE EF
; Dest at 0x300: 00 00 00 00 (initially)
; After: M[0x300..0x303] = DE AD BE EF
; R0=0, R1=0x204, R2=0, R3=0x304, R4=0, R5=0
; CC: Z=1 (equal lengths in MOVC3)
;
; Operand encoding: len=#4 = short literal 0x04
;   srcaddr (R2) = register-deferred would be 0x62 but MOVC3 uses .ab addressing
;   Actually for MOVC3 the address operands (.ab) use regular operand specifiers
;   R2 as address = register mode 0x52 (the register value IS the address)
;   But .ab means "address of byte" — the specifier is treated as an address.
;   With register mode on .ab, the register value IS the address.
deposit r2 200
deposit r3 300
deposit -b 200 de
deposit -b 201 ad
deposit -b 202 be
deposit -b 203 ef
deposit -b 300 00
deposit -b 301 00
deposit -b 302 00
deposit -b 303 00
deposit psl 041F0000
deposit pc 0
deposit -b 0 28
deposit -b 1 04
deposit -b 2 62
deposit -b 3 63
step
examine r0
examine r1
examine r3
examine -b 300
examine -b 301
examine -b 302
examine -b 303
examine psl
