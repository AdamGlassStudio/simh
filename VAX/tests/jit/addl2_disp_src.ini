; addl2_disp_src.ini — ADDL2 4(R2), R3
; R2=0x100 (base), M[0x104]=0x10 (16), R3=0x20 (32); result: R3 = 0x30 (48)
; Encoding: C0 A2 04 53
;   C0 = ADDL2, A2 = mode_A(byte_disp)/R2, 04 = disp=4, 53 = R3
deposit r2 100
deposit r3 20
; deposit 0x10 (16) at byte address 0x104 (little-endian)
deposit -b 104 10
deposit -b 105 0
deposit -b 106 0
deposit -b 107 0
; instruction bytes at PC=0
deposit pc 0
deposit -b 0 c0
deposit -b 1 a2
deposit -b 2 4
deposit -b 3 53
step
examine r0
examine r1
examine r2
examine r3
examine r4
examine r5
examine r6
examine r7
examine r8
examine r9
examine r10
examine r11
examine r12
examine r13
examine r14
examine psl
