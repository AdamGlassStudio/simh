; movq_reg_reg.ini — MOVQ R0, R2 (register to register quadword move)
; R0 = 0x11111111, R1 = 0x22222222
; Result: R2 = 0x11111111, R3 = 0x22222222; N=0, Z=0, V=0, C=0
; Encoding: 7D 50 52
;   7D=MOVQ, 50=reg R0, 52=reg R2
deposit r0 11111111
deposit r1 22222222
deposit pc 0
deposit -b 0 7d
deposit -b 1 50
deposit -b 2 52
step
examine r0
examine r1
examine r2
examine r3
examine r4
examine r5
examine r6
examine r7
examine r8
examine r9
examine r10
examine r11
examine r12
examine r13
examine r14
examine psl
