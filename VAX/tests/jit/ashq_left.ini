; ashq_left.ini — ASHQ #4, R0, R2 (left shift quadword by 4)
; Opcode 79, spec cnt=#4=0x04, spec R0=0x50, spec R2=0x52
; R0:R1 = 0x00000001:0x80000000 (src quad = 0x0000000180000000)
; Shift left 4: result = 0x0000001800000000
; R2(lo) = 0x00000000, R3(hi) = 0x00000018
deposit r0 80000000
deposit r1 00000001
deposit r2 0
deposit r3 0
deposit psl 041F0000
deposit pc 0
deposit -b 0 79
deposit -b 1 04
deposit -b 2 50
deposit -b 3 52
step
examine r0
examine r1
examine r2
examine r3
examine psl
