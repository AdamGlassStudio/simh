; movq_reg_autodec.ini — MOVQ R0, -(SP)
; R0 = 0xAAAABBBB (lo word), R1 = 0xCCCCDDDD (hi word), SP(R14) = 0x1000
; SP decrements by 8: new SP = 0xFF8
; M[0xFF8] = 0xAAAABBBB (lo), M[0xFFC] = 0xCCCCDDDD (hi)
; N=1 (bit31 of hi word 0xCCCCDDDD is set), Z=0, V=0, C=0
; Encoding: 7D 50 7E
;   7D=MOVQ, 50=reg R0, 7E=autodecrement SP (mode7, reg14)
deposit r0 AAAABBBB
deposit r1 CCCCDDDD
deposit r14 1000
deposit pc 0
deposit -b 0 7d
deposit -b 1 50
deposit -b 2 7e
step
examine r0
examine r1
examine r2
examine r3
examine r4
examine r5
examine r6
examine r7
examine r8
examine r9
examine r10
examine r11
examine r12
examine r13
examine r14
examine psl
