; ashl_right.ini — ASHL #-4, R0, R1 (right shift by 4)
; R0 = 0x00000080 (128); cnt = -4 (byte immediate 0xFC)
; Result: R1 = 0x00000008; N=0, Z=0, V=0, C=0
; Encoding: 78 8F FC 50 51
;   78=ASHL, 8F=immediate-byte specifier (autoincrement PC), FC=-4, 50=R0, 51=R1
deposit r0 80
deposit pc 0
deposit -b 0 78
deposit -b 1 8f
deposit -b 2 fc
deposit -b 3 50
deposit -b 4 51
step
examine r0
examine r1
examine r2
examine r3
examine r4
examine r5
examine r6
examine r7
examine r8
examine r9
examine r10
examine r11
examine r12
examine r13
examine r14
examine psl
