; insv_reg.ini — INSV R0, #8, #4, R2 (insert 4 bits at position 8)
; Opcode F0: src=R0(0x50), pos=8(lit 0x08), size=4(lit 0x04), base=R2(0x52)
; R0 = 0x0000000F (source, low 4 bits = 0xF)
; R2 = 0x00000000 → after insert: bits [11:8] = 0xF → R2 = 0x00000F00
; INSV does not set CC
deposit r0 0000000F
deposit r2 00000000
deposit psl 041F0000
deposit pc 0
deposit -b 0 f0
deposit -b 1 50
deposit -b 2 08
deposit -b 3 04
deposit -b 4 52
step
examine r0
examine r2
