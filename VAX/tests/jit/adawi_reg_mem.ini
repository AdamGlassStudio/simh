; adawi_reg_mem.ini — ADAWI R0, (R1) (add aligned word interlocked)
; Opcode 58, spec R0=0x50, spec (R1)=0x61
; R0 = 0x0010 (16), M[0x200] = 0x0020 (32)
; Result: M[0x200] = 0x0030 (48), CC: N=0 Z=0 V=0 C=0
deposit r0 10
deposit r1 200
deposit -w 200 0020
deposit psl 041F0000
deposit pc 0
deposit -b 0 58
deposit -b 1 50
deposit -b 2 61
step
examine r0
examine -w 200
examine psl
