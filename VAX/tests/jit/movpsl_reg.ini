; MOVPSL R2 — copy PSL into register after CLRL R1 (forces Z=1,N=0,V=0)
; CLRL R1 = 0xD4 0x51 (2 bytes)
; MOVPSL R2 = 0xDC 0x52 (2 bytes)
deposit r1 deadbeef
deposit r2 0
deposit pc 0
deposit -b 0 d4
deposit -b 1 51
deposit -b 2 dc
deposit -b 3 52
set break 4
go
examine r0
examine r1
examine r2
examine r3
examine r4
examine r5
examine r6
examine r7
examine r8
examine r9
examine r10
examine r11
examine r12
examine r13
examine r14
examine psl
