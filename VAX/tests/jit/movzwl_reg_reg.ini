; MOVZWL R0, R1 — zero-extend low word of R0 into R1
; R0 = 0x1234BEEF (low word = 0xBEEF)
; R1 = 0xDEADBEEF → becomes 0x0000BEEF
; Encoding: 3C 50 51
deposit r0 1234BEEF
deposit r1 DEADBEEF
deposit pc 0
deposit -b 0 3C
deposit -b 1 50
deposit -b 2 51
step
