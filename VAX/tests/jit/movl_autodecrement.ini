; movl_autodecrement.ini — MOVL -(R2), R3
; R2=0x104 (pre-decrement to 0x100); M[0x100]=0x12345678; result: R2=0x100, R3=0x12345678
; Encoding: D0 72 53
;   D0 = MOVL, 72 = mode7(autodecrement)/R2, 53 = R3
deposit r2 104
; deposit 0x12345678 at byte address 0x100 (little-endian)
deposit -b 100 78
deposit -b 101 56
deposit -b 102 34
deposit -b 103 12
; instruction bytes at PC=0
deposit pc 0
deposit -b 0 d0
deposit -b 1 72
deposit -b 2 53
step
examine r0
examine r1
examine r2
examine r3
examine r4
examine r5
examine r6
examine r7
examine r8
examine r9
examine r10
examine r11
examine r12
examine r13
examine r14
examine psl
