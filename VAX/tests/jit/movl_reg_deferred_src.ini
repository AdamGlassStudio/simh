; movl_reg_deferred_src.ini — MOVL (R2), R3
; R2 holds address 0x100; M[0x100] = 0xDEADBEEF; result: R3 = 0xDEADBEEF
; Encoding: D0 62 53
;   D0 = MOVL, 62 = mode6(reg_deferred)/R2, 53 = mode5(register)/R3
deposit r2 100
; deposit 0xDEADBEEF at byte address 0x100 (little-endian)
deposit -b 100 ef
deposit -b 101 be
deposit -b 102 ad
deposit -b 103 de
; instruction bytes at PC=0
deposit pc 0
deposit -b 0 d0
deposit -b 1 62
deposit -b 2 53
step
examine r0
examine r1
examine r2
examine r3
examine r4
examine r5
examine r6
examine r7
examine r8
examine r9
examine r10
examine r11
examine r12
examine r13
examine r14
examine psl
