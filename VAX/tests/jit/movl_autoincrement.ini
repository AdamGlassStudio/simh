; movl_autoincrement.ini — MOVL (R2)+, R3
; R2=0x100 (post-increment to 0x104); M[0x100]=0xCAFEBABE; result: R3=0xCAFEBABE, R2=0x104
; Encoding: D0 82 53
;   D0 = MOVL, 82 = mode8(autoincrement)/R2, 53 = R3
deposit r2 100
; deposit 0xCAFEBABE at byte address 0x100 (little-endian)
deposit -b 100 be
deposit -b 101 ba
deposit -b 102 fe
deposit -b 103 ca
; instruction bytes at PC=0
deposit pc 0
deposit -b 0 d0
deposit -b 1 82
deposit -b 2 53
step
examine r0
examine r1
examine r2
examine r3
examine r4
examine r5
examine r6
examine r7
examine r8
examine r9
examine r10
examine r11
examine r12
examine r13
examine r14
examine psl
