; ashl_overflow.ini — ASHL $2, R0, R1 with overflow
; R0 = 0x40000000; cnt = 2 (short literal)
; 0x40000000 << 2 = 0x00000000 (bits shifted out of 32-bit range)
; Result: R1 = 0x00000000; V=1 (bits lost), N=0, Z=1, C=0
; Encoding: 78 02 50 51
;   78=ASHL, 02=short literal 2, 50=reg R0, 51=reg R1
deposit r0 40000000
deposit pc 0
deposit -b 0 78
deposit -b 1 02
deposit -b 2 50
deposit -b 3 51
step
examine r0
examine r1
examine r2
examine r3
examine r4
examine r5
examine r6
examine r7
examine r8
examine r9
examine r10
examine r11
examine r12
examine r13
examine r14
examine psl
