; extzv_reg.ini — EXTZV #8, #4, R2, R3 (extract 4 bits at position 8)
; Opcode EF: pos=8(lit 0x08), size=4(lit 0x04), base=R2(0x52), dst=R3(0x53)
; R2 = 0x0000AB00 → bits [11:8] = 0xB = 11
; Result: R3 = 0x0B, CC: N=0 Z=0 V=0
deposit r2 0000AB00
deposit r3 0
deposit psl 041F0000
deposit pc 0
deposit -b 0 ef
deposit -b 1 08
deposit -b 2 04
deposit -b 3 52
deposit -b 4 53
step
examine r2
examine r3
examine psl
