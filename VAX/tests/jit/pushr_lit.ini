; PUSHR #3 — push R0 and R1 onto stack (R1 first, then R0)
; SP starts at 0x1000; after push SP should be 0xFF8
; R0=0x11111111, R1=0x22222222
; PUSHR #3 = 0xBB 0x03 (short literal mask = bit0|bit1 → push R1 then R0)
deposit r0 11111111
deposit r1 22222222
deposit r14 00001000
deposit pc 0
deposit -b 0 bb
deposit -b 1 03
set break 2
go
examine r0
examine r1
examine r2
examine r3
examine r4
examine r5
examine r6
examine r7
examine r8
examine r9
examine r10
examine r11
examine r12
examine r13
examine r14
examine psl
